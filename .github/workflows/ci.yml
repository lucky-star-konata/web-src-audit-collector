name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Bash syntax
        if: runner.os == 'Linux'
        run: |
          bash -n scripts/semgrep_batch_scan.sh
          bash -n scripts/clean_source.sh
      - name: Syntax check
        run: python -m compileall -q scripts
      - name: Unit tests
        run: python -m unittest discover -s tests -v
