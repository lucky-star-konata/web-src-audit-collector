rules:
  # 污点追踪：用户输入 -> SQL 查询，避免把常量 SQL 变量误报
  - id: php-sqli-taint
    languages: [php]
    severity: ERROR
    message: 用户输入经字符串拼接进入 SQL 查询，存在 SQL 注入
    mode: taint
    pattern-sources:
      - pattern: $_GET
      - pattern: $_POST
      - pattern: $_REQUEST
      - pattern: $_COOKIE
    pattern-sinks:
      - pattern: $DB->query($SQL)
      - pattern: $DB->exec($SQL)
      - pattern: mysqli_query($CONN, $SQL)
      - pattern: mysql_query($SQL)

  # 污点追踪：用户输入 -> include/require，避免把模板常量包含误报
  - id: php-lfi-taint
    languages: [php]
    severity: ERROR
    message: 用户输入流入 include/require，存在本地或远程文件包含
    mode: taint
    pattern-sources:
      - pattern: $_GET
      - pattern: $_POST
      - pattern: $_REQUEST
      - pattern: $_COOKIE
    pattern-sinks:
      - pattern: include $FILE;
      - pattern: include_once $FILE;
      - pattern: require $FILE;
      - pattern: require_once $FILE;

  - id: php-danger-eval
    languages: [php]
    severity: ERROR
    message: 使用了 eval()，若参数可控可导致远程代码执行
    pattern: eval(...)

  - id: php-danger-command-exec
    languages: [php]
    severity: ERROR
    message: 使用了命令执行函数，若参数可控可导致命令执行
    patterns:
      - pattern-either:
          - pattern: system(...)
          - pattern: exec(...)
          - pattern: shell_exec(...)
          - pattern: passthru(...)
          - pattern: popen(...)
          - pattern: proc_open(...)

  - id: php-danger-unserialize
    languages: [php]
    severity: ERROR
    message: 反序列化不可信数据，存在对象注入风险
    pattern: unserialize(...)

  - id: php-file-upload
    languages: [php]
    severity: WARNING
    message: 文件上传落盘点，需确认后缀与目录是否可控
    pattern: move_uploaded_file($TMP, $DEST)
